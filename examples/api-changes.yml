# Copy to .github/workflows/api-changes.yml
name: API changes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

# One run per PR at a time, so quick pushes can't race to create duplicate comments.
concurrency:
  group: api-changes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: Delocy/merge-docs@v1
        with:
          command: pr-comment
