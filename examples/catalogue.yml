# Copy to .github/workflows/catalogue.yml, then set Settings → Pages → Source to "GitHub Actions".
# Change `main` below if your default branch has another name.
name: API catalogue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Don't cancel a deploy that's already running; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: Delocy/merge-docs@v1
        with:
          command: build-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
